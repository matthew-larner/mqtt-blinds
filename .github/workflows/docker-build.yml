name: Build Image and Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing so two builds cannot select the same release number.
concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: release
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          prefix = datetime.now(ZoneInfo("Australia/Perth")).strftime("%Y.%m")
          tags = subprocess.check_output(
              ["git", "tag", "--list", f"{prefix}.*"], text=True
          ).splitlines()
          pattern = re.compile(rf"{re.escape(prefix)}\.([0-9]+)")
          numbers = [int(match[1]) for tag in tags if (match := pattern.fullmatch(tag))]
          version = f"{prefix}.{max(numbers, default=-1) + 1}"
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nimage={image}\n")
          print(f"Building {image}:{version}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --latest
